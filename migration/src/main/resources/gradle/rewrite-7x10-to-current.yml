# Flattened API-rename corpus for the route 7.10 -> current release.
#
# ICM 11, 12 and 13 are no longer deployment targets, so these recipes are no longer
# version steps. Their CONTENT keeps full value: a rename that happened in ICM 12 is
# still a rename between 7.10 and the current release.
#
# Provenance is preserved in the sub-recipe names (icm12.*, icm13.*), so per-version
# sets can be reconstructed if a 14-to-N upgrade path is ever wanted.
#
# On the direct route the compiler surfaces every delta at once, so this set is a
# CROSS-CHECK rather than a migration step: no change confirms the compiler-driven
# fixes landed where Intershop intends; any change is a finding. Read the diff before
# committing it, because these recipes match on signature and cannot tell that a call
# site is already correct.
---
type: specs.openrewrite.org/v1beta/recipe
name: com.intershop.migration.MigrationFrom7x10
displayName: Migrate API usages from ICM 7.10 to the current release
description: Union of the former per-version recipe sets, applied as one pass.
recipeList:
  - com.intershop.migration.MigrationToICM12
  - com.intershop.migration.MigrationToICM13
---
